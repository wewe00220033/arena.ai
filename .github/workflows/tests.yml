name: Python safety tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - working-directory: OSRS_Bot
        run: python -m unittest -v test_safety.py
      - working-directory: OSRS_Bot
        run: python -m py_compile run_stronghold_bot.py safety.py osrs_ai_solver.py
